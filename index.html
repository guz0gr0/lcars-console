<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCARS Personal Console</title>
  <style>
    body {
      background: #000;
      color: #f2b36f;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .panel {
      max-width: 900px;
      margin: auto;
      border-left: 18px solid #cc6699;
      border-top: 18px solid #ff9966;
      padding: 32px;
    }

    h1 {
      color: #ffcc66;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h2 {
      color: #cc99cc;
    }

    a {
      color: #99ccff;
    }

    .status {
      margin-top: 30px;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>LCARS Personal Console</h1>

    <h2>Personal Interface Experiment</h2>

    <p>
      A private experimental utility inspired by fictional starship
      computer interfaces.
    </p>

    <p>
      This project is maintained for personal use and is not offered as
      a public service.
    </p>

    <p class="status">
      System status: Operational
    </p>

    <p>
      <a href="privacy.html">Privacy Policy</a>
    </p>
  </div>

</html>
